[package]
name = "cachy"
version = "0.1.0"
edition = "2024"
description = "Moves files from a mergerfs cache branch to the backing pool. Inspired by mergerfs-cache-mover."
license = "GPL-3.0-or-later"
repository = "https://github.com/yannik-dittmar/cachy"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
