[package]
name = "cachy"
version = "0.1.0"
edition = "2024"
description = "Moves files from a mergerfs cache branch to the backing pool. Inspired by mergerfs-cache-mover."
license = "GPL-3.0-or-later"
repository = "https://github.com/yannik-dittmar/cachy"
publish = false

[features]
# Test-only: lets the CACHY_FAULT environment variable inject a syscall error
# or a crash at any filesystem operation. See src/fault.rs.
fault-injection = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.33"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
proptest = "1.12.0"
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"
