# Example cachy configuration. Copy it, then adjust the paths and sizes.
# Byte sizes take a K, M, G or T suffix (binary: 1G is 1024^3 bytes);
# durations take an s, m, h or d suffix.

# The fast branch that cachy drains: the first branch of the cache pool.
cache_branch: /mnt/cache

# The cache pool: the mergerfs mount over the cache branch and the backing
# branches. cachy reads its branches, with their modes and minfreespace, from
# mergerfs's runtime interface (<cache pool>/.mergerfs), and refuses to run
# unless the cache branch is its first branch. It also warns if the cache
# pool's moveonenospc can move files back onto the cache branch, or if the
# threshold is below the cache branch's minfreespace.
cache_pool: /mnt/pool

# The slow branches that receive moved files, for when the cache pool's
# runtime interface is unavailable (xattr=nosys) or no cache_pool is set. A
# single filesystem is a backing pool with one branch. Each entry uses
# mergerfs's branch syntax: <path>[=<mode>[,<minfreespace>]], where the mode is
#   RW - takes moved files (default)
#   RO - read-only: never written to
#   NC - no-create: never receives moved files
# and minfreespace (default 0) is free space that a move must leave on the
# branch. With a readable cache pool, this list is ignored.
backing_branches:
  - /mnt/storage

# Each file moves to one backing branch that takes new files, keeps its
# minfreespace free and has room for the whole file (all links of a hardlink
# group go together). Of those, cachy prefers a branch that already has the
# file's directory, then the one with the most free space. Each branch takes
# one move at a time; different branches move in parallel.

# A run starts when the cache branch's free space falls below the threshold,
# and moves files until free space reaches the target. Either may also be a
# percentage of the cache branch's size, such as 10% or 12.5%. At its start,
# a run fixes how many bytes it moves: the target minus the free space then.
# It stops once its moves add up to that, even if the filesystem has not yet
# shown all of the space as free, so delayed frees and snapshots cannot make
# it move everything.
threshold: 100G
target: 200G

# Which files a run moves first:
#   atime - least recently accessed first (default)
#   mtime - least recently modified first
# Ties go to the older mtime, then to the path in byte order. On a cache branch
# mounted noatime, cachy orders by mtime instead, with a warning. On a ZFS
# cache branch, cachy warns unless this is set: ZFS's atime=off does not always
# show as a mount option. Default: atime.
order: atime

# Files changed more recently than this are never moved. Default: 15m.
minimum_age: 15m

# Optional. Files unchanged for longer than this are moved by every run,
# whatever the free space, and before any other file, so that nothing stays
# on the cache branch for longer than this. A check then walks the cache
# branch; without a max age, it only reads the free space. Must be above the
# minimum age. `cachy run --max-age <duration>` overrides it. Default: none.
# max_age: 7d

# What makes a file in use, so that it is not moved:
#   read  - it is open for writing (default)
#   write - it is open at all, even for reading only
lease_type: read

# Metadata a move may lose, with a warning, when the backing branch cannot
# store it: xattrs, acls. By default, any loss fails the move.
allow_metadata_loss: []

# How a move checks its copy:
#   hash     - hash the source while copying (default)
#   readback - also read the copy back from storage and compare hashes
verify: hash

# Files and directories that stay on the cache branch. Each entry is one line
# of a .gitignore placed at the root of the cache branch, with the usual
# gitignore rules:
#   - A pattern without a slash matches at any depth: `*.part` matches
#     movies/a.part as well as a.part.
#   - A leading slash anchors a pattern at the cache branch root: `/appdata/`
#     matches only the top-level appdata directory. So does any other slash
#     before the end: `media/tmp` means `/media/tmp`.
#   - A trailing slash matches only directories.
#   - `**/` matches any number of directories; `!` re-includes a path that an
#     earlier pattern excluded, unless a parent directory is excluded.
#   - An entry starting with `#` is a comment; write `\#` for a literal `#`.
# Patterns only ever see paths inside the cache branch. Excluded directories
# are not walked at all. Quote patterns that start with `*`, `!` or `#`, which
# YAML would otherwise read differently.
exclude:
  # Application data that must stay on the fast branch.
  - /appdata/
  # Unfinished downloads, anywhere.
  - '*.part'
  # SnapRAID content and parity files, and its directory, if they live on the
  # cache branch.
  - /snapraid.content
  - /snapraid.parity
  - /.snapraid/
